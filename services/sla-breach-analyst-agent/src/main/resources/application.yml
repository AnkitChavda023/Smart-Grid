server:
  port: 8092

spring:
  application:
    name: sla-breach-analyst-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/sla_breach_analyst_db
    username: smartgrid
    password: smartgrid_dev_pw
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

smartgrid:
  kafka:
    bootstrap-servers: localhost:9092
    schema-registry-url: http://localhost:18081
    group-id: sla-breach-analyst-agent
  tracing:
    service-name: sla-breach-analyst-agent
  sla-breach-analyst:
    confidence-threshold: 0.70
    breach-probability-threshold: 0.65
    rolling-window-days: 90
    forecast-horizon-days: 30
    target-stock-level: 100
    vendor-service:
      base-url: http://localhost:8182
    inventory-service:
      base-url: http://localhost:8183
    rag-service:
      base-url: http://localhost:8096
    mcp-server:
      base-url: http://localhost:8095
      internal-token: local-dev-internal-token
    openai:
      # Defaults to a local Ollama instance (OpenAI-compatible API) so this agent works with
      # zero cloud dependency out of the box. To use real OpenAI instead, set all three env
      # vars below - nothing here needs to change, this is a pure config swap:
      #   OPENAI_API_KEY=sk-...  LLM_BASE_URL=https://api.openai.com/v1  LLM_MODEL=gpt-4o-mini
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
      chat-model: ${LLM_MODEL:llama3.1:8b}
